name: Build and Deploy Git Manager

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: git-manager-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Ubuntu server
        uses: appleboy/ssh-action@v1.2.2
        env:
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          APP_PORT: ${{ vars.APP_PORT }}
          GATEKEEPER_PORT: ${{ vars.GATEKEEPER_PORT }}
          DOCKER_CONTAINER: ${{ vars.DOCKER_CONTAINER }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ vars.SERVER_SSH_PORT || '22' }}
          envs: WORKER_NAME,APP_PORT,GATEKEEPER_PORT,DOCKER_CONTAINER,GITHUB_CLIENT_ID,GITHUB_CLIENT_SECRET,FLASK_SECRET_KEY,CLOUDFLARE_API_TOKEN
          script: |
            set -e

            SERVER_PATH="${HOME}/git-manager"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            # Recover from deployments previously run as root (or by another
            # account). Git must be able to write .git/config and create config.lock.
            mkdir -p "$SERVER_PATH"
            if [ -d "$SERVER_PATH/.git" ]; then
              if ! test -w "$SERVER_PATH/.git"; then
                sudo chown -R "$(id -u):$(id -g)" "$SERVER_PATH"
              fi
              # A stale lock left by an interrupted Git command blocks config updates.
              # Only remove it after confirming no Git process is operating here.
              if ! pgrep -x git >/dev/null 2>&1; then
                rm -f "$SERVER_PATH/.git/config.lock"
              fi
            fi

            cd "$SERVER_PATH"
            if [ ! -d .git ]; then
              git init
            fi

            # Ensure the repository metadata is writable before changing its remote.
            if ! test -w .git || ! test -w .git/config; then
              sudo chown -R "$(id -u):$(id -g)" "$SERVER_PATH"
            fi
            test -w .git || {
              echo "ERROR: $SERVER_PATH/.git is not writable by $(id -un)." >&2
              ls -ld "$SERVER_PATH" "$SERVER_PATH/.git" "$SERVER_PATH/.git/config" || true
              df -h "$SERVER_PATH" || true
              exit 1
            }

            if git remote get-url origin >/dev/null 2>&1; then
              git remote set-url origin "$REPO_URL"
            else
              git remote add origin "$REPO_URL"
            fi

            # Fail with useful diagnostics if the filesystem is full/read-only or
            # Git cannot create its lock file; do not hide the original cause.
            git config --local --get remote.origin.url >/dev/null
            git fetch --prune origin master
            git checkout -B master origin/master
            git reset --hard origin/master
            git clean -fd

            WORKER_NAME="${WORKER_NAME:-git-manager}" \
            APP_PORT="${APP_PORT:-}" \
            GATEKEEPER_PORT="${GATEKEEPER_PORT:-10000}" \
            DOCKER_CONTAINER="${DOCKER_CONTAINER:-git-manager}" \
            GITHUB_CLIENT_ID="$GITHUB_CLIENT_ID" \
            GITHUB_CLIENT_SECRET="$GITHUB_CLIENT_SECRET" \
            FLASK_SECRET_KEY="$FLASK_SECRET_KEY" \
            CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN" \
            bash ./deploy.sh
