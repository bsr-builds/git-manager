name: Build and Deploy Git Manager

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: git-manager-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Ubuntu server
        uses: appleboy/ssh-action@v1.2.2
        env:
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          APP_PORT: ${{ vars.APP_PORT }}
          GATEKEEPER_PORT: ${{ vars.GATEKEEPER_PORT }}
          DOCKER_CONTAINER: ${{ vars.DOCKER_CONTAINER }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
          FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ vars.SERVER_SSH_PORT || '22' }}
          envs: WORKER_NAME,APP_PORT,GATEKEEPER_PORT,DOCKER_CONTAINER,GITHUB_CLIENT_ID,GITHUB_CLIENT_SECRET,FLASK_SECRET_KEY,CLOUDFLARE_API_TOKEN
          script: |
            set -e

            SERVER_PATH="${HOME}/git-manager"
            REPO_URL="https://github.com/${{ github.repository }}.git"

            mkdir -p "$SERVER_PATH"

            # Repair ownership first. Older deployments may have created .git
            # as root, leaving the SSH user unable to create .git/config.lock.
            if command -v sudo >/dev/null 2>&1; then
              sudo chown -R "$(id -u):$(id -g)" "$SERVER_PATH" || {
                echo "ERROR: Could not repair ownership for $SERVER_PATH" >&2
                id
                ls -ld "$HOME" "$SERVER_PATH" "$SERVER_PATH/.git" 2>/dev/null || true
                exit 1
              }
            fi

            cd "$SERVER_PATH"

            # If the existing Git metadata remains unwritable, rebuild only the
            # .git directory. This avoids stale config.lock and bad ownership.
            if [ -d .git ] && { [ ! -w .git ] || [ ! -w .git/config ]; }; then
              echo "Git metadata is not writable; recreating .git metadata."
              if command -v sudo >/dev/null 2>&1; then
                sudo rm -rf "$SERVER_PATH/.git"
              else
                rm -rf "$SERVER_PATH/.git"
              fi
            fi

            if [ ! -d .git ]; then
              git init
            fi

            # Diagnose filesystem and lock failures before attempting remote update.
            if [ -e .git/config.lock ]; then
              echo "Found stale .git/config.lock; checking for active Git processes."
              if pgrep -x git >/dev/null 2>&1; then
                echo "ERROR: A Git process is active; refusing to remove config.lock." >&2
                pgrep -a git || true
                exit 1
              fi
              rm -f .git/config.lock || {
                echo "ERROR: Cannot remove .git/config.lock" >&2
                ls -l .git/config.lock || true
                exit 1
              }
            fi

            if [ ! -w .git ] || [ ! -w .git/config ]; then
              echo "ERROR: Git metadata still is not writable." >&2
              id
              ls -ld "$HOME" "$SERVER_PATH" .git .git/config
              df -h "$SERVER_PATH" || true
              df -i "$SERVER_PATH" || true
              exit 1
            fi

            # Do not rewrite .git/config on every deployment. The existing
            # origin is already correct in this repository; calling set-url
            # unnecessarily creates .git/config.lock and was the failing command.
            CURRENT_REMOTE="$(git remote get-url origin 2>/dev/null || true)"
            if [ -z "$CURRENT_REMOTE" ]; then
              git remote add origin "$REPO_URL"
            elif [ "$CURRENT_REMOTE" != "$REPO_URL" ]; then
              git remote set-url origin "$REPO_URL"
            else
              echo "origin already matches $REPO_URL; skipping config rewrite."
            fi

            git fetch --prune origin master
            git checkout -B master origin/master
            git reset --hard origin/master
            git clean -fd

            WORKER_NAME="${WORKER_NAME:-git-manager}" \
            APP_PORT="${APP_PORT:-}" \
            GATEKEEPER_PORT="${GATEKEEPER_PORT:-10000}" \
            DOCKER_CONTAINER="${DOCKER_CONTAINER:-git-manager}" \
            GITHUB_CLIENT_ID="$GITHUB_CLIENT_ID" \
            GITHUB_CLIENT_SECRET="$GITHUB_CLIENT_SECRET" \
            FLASK_SECRET_KEY="$FLASK_SECRET_KEY" \
            CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN" \
            bash ./deploy.sh
